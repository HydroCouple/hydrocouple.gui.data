name: Documentation
on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen 1.17.0
        # Match the version used to validate the GUI-derived layout and theme.
        # Distribution packages can lag behind the required layout/config tags.
        env:
          DOXYGEN_VERSION: 1.17.0
          DOXYGEN_SHA256: 75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/doxygen.tar.gz" \
            "https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          echo "${DOXYGEN_SHA256}  ${RUNNER_TEMP}/doxygen.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/doxygen.tar.gz" \
            --directory "$RUNNER_TEMP" "doxygen-${DOXYGEN_VERSION}/bin/doxygen"
          doxygen_version="$("$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin/doxygen" --version)"
          printf '::notice::Doxygen version: %s\n' "$doxygen_version"
          # Official binaries may append their source revision in parentheses.
          test "${doxygen_version%% *}" = "$DOXYGEN_VERSION"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Generate themed documentation
        working-directory: docs
        run: |
          doxygen Doxyfile
          test -s html/index.html
          test -s html/doxygen-awesome.css
          test -s html/manual.css
          test -s html/doxygen-awesome-darkmode-toggle.js
      - name: Upload documentation for review
        uses: actions/upload-artifact@v4
        with:
          name: openswmm-data-docs
          path: docs/html
          if-no-files-found: error
